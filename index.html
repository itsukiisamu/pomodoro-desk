  <style>
    :root, body[data-theme="dark"]{
      --bg:#101218; --panel:#181b22; --panel2:#20242d; --field:#11141b;
      --text:#f6f7fb; --muted:#a4adbb; --line:#303541;
      --accent:#ff5f57; --accent2:#f2a65a; --ok:#62d394; --warn:#ffd166;
      --body-bg:linear-gradient(135deg,#101218 0%,#151821 58%,#191611 100%);
      --app-bg:rgba(24,27,34,.96); --side-bg:rgba(17,20,27,.45);
      --card-bg:#141821; --player-bg:#0d0f15; --hover-line:#414856;
      --shadow:0 24px 70px rgba(0,0,0,.34);
    }
    body[data-theme="light"]{
      --bg:#f7f5f1; --panel:#ffffff; --panel2:#ece8df; --field:#fffdfa;
      --text:#26231f; --muted:#716b62; --line:#ddd4c8;
      --accent:#e85d4f; --accent2:#e7a95a; --ok:#2f9e6d; --warn:#ae7d00;
      --body-bg:linear-gradient(135deg,#fbfaf7 0%,#f2ede5 58%,#fff7ed 100%);
      --app-bg:rgba(255,255,255,.96); --side-bg:rgba(247,244,238,.7);
      --card-bg:#fffaf2; --player-bg:#f1ece4; --hover-line:#cfc5b7;
      --shadow:0 24px 70px rgba(72,55,40,.13);
    }
    body[data-theme="tomato"]{
      --bg:#fff6f1; --panel:#fffaf6; --panel2:#ffe4d8; --field:#fffefd;
      --text:#3c2924; --muted:#8b6d64; --line:#f1c9bd;
      --accent:#ef7465; --accent2:#f4b082; --ok:#4fa87b; --warn:#b47a26;
      --body-bg:linear-gradient(135deg,#fff8f3 0%,#ffe8df 56%,#fff3dc 100%);
      --app-bg:rgba(255,250,246,.97); --side-bg:rgba(255,237,229,.62);
      --card-bg:#fff2ea; --player-bg:#f8ddd4; --hover-line:#eab7a8;
      --shadow:0 24px 70px rgba(156,78,57,.16);
    }
    @media (prefers-color-scheme: light){
      body[data-theme="system"]{
        --bg:#f7f5f1; --panel:#ffffff; --panel2:#ece8df; --field:#fffdfa;
        --text:#26231f; --muted:#716b62; --line:#ddd4c8;
        --accent:#e85d4f; --accent2:#e7a95a; --ok:#2f9e6d; --warn:#ae7d00;
        --body-bg:linear-gradient(135deg,#fbfaf7 0%,#f2ede5 58%,#fff7ed 100%);
        --app-bg:rgba(255,255,255,.96); --side-bg:rgba(247,244,238,.7);
        --card-bg:#fffaf2; --player-bg:#f1ece4; --hover-line:#cfc5b7;
        --shadow:0 24px 70px rgba(72,55,40,.13);
      }
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;
      background:var(--body-bg);
      color:var(--text); padding:20px; display:grid; place-items:center;
    }
    button,input,select{font:inherit}
    button{
      border:1px solid transparent; border-radius:8px; padding:10px 12px; cursor:pointer;
      background:var(--panel2); color:var(--text); transition:transform .15s ease,filter .15s ease,border-color .15s ease;
      min-height:42px;
    }
    button:hover{transform:translateY(-1px); filter:brightness(1.08); border-color:var(--hover-line)}
    button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{
      outline:2px solid var(--accent2); outline-offset:2px;
    }
    input,select{
      width:100%; background:var(--field); color:var(--text); border:1px solid var(--line);
      border-radius:8px; padding:10px 11px; min-height:42px;
    }
    label{font-size:12px; color:var(--muted); display:block}
    label span{display:block; margin-bottom:6px}
    .app{
      width:min(1120px,100%); background:var(--app-bg); border:1px solid var(--line);
      border-radius:8px; box-shadow:var(--shadow); overflow:hidden;
    }
    .header{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line)}
    .header-actions{display:flex; align-items:center; gap:8px}
    .lang-select{width:auto; min-width:92px; min-height:34px; padding:6px 9px; font-size:12px}
    h1{font-size:18px; margin:0; letter-spacing:0}
    .badge{font-size:12px; color:var(--muted); white-space:nowrap}
    .layout{display:block}
    .main,.side{padding:20px}
    .side{border-top:1px solid var(--line); background:var(--side-bg)}
    .workbench{display:grid; grid-template-columns:minmax(0,1fr) minmax(340px,430px); gap:18px; align-items:start}
    .timer-pane,.media-pane{min-width:0}
    .modes{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px}
    .mode.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-weight:750}
    .task-row{display:grid; grid-template-columns:minmax(0,1fr) 46px; gap:8px}
    .icon-btn{padding:0; display:grid; place-items:center; font-size:18px}
    .timer{text-align:center; font-variant-numeric:tabular-nums; font-weight:850; font-size:clamp(64px,14vw,116px); line-height:1; letter-spacing:0; margin:28px 0 14px}
    .status{text-align:center; color:var(--muted); min-height:1.5em; margin-bottom:18px}
    .primary{display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:8px}
    .start{background:linear-gradient(135deg,var(--accent),var(--accent2)); font-weight:800}
    .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0}
    .card{background:var(--card-bg); border:1px solid var(--line); border-radius:8px; padding:12px}
    .label{font-size:12px; color:var(--muted); margin-bottom:5px}
    .value{font-size:22px; font-weight:780; font-variant-numeric:tabular-nums}
    .toolbar{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
    .links{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
    .links a{display:block; text-align:center; text-decoration:none; color:var(--text); background:var(--panel2); padding:11px; border-radius:8px; min-height:42px}
    .section{border-top:1px solid var(--line); padding-top:16px; margin-top:16px}
    .media-pane.section{margin-top:0}
    details{border-top:1px solid var(--line); margin-top:16px; padding-top:14px}
    summary{cursor:pointer; color:var(--muted); user-select:none}
    .summary-label{display:inline-flex; align-items:center; gap:7px}
    .summary-icon{font-size:15px; line-height:1}
    .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
    .grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px}
    .sound-row{display:grid; grid-template-columns:minmax(0,1fr) 90px; gap:8px}
    .toggles{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; font-size:13px; color:var(--muted)}
    .toggles label{display:flex; align-items:center; gap:7px}
    .toggles input{width:auto; min-height:auto}
    .media-row{display:grid; gap:8px; margin-top:12px}
    .media-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px}
    .info-note{font-size:12px; color:var(--muted); line-height:1.55; margin-top:8px}
    .info-note strong{display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; background:var(--panel2); color:var(--text); font-size:12px; margin-right:5px}
    .player{margin-top:10px; aspect-ratio:16/9; background:var(--player-bg); border:1px solid var(--line); border-radius:8px; overflow:hidden}
    .player iframe{width:100%; height:100%; border:0; display:block}
    .player.empty{display:grid; place-items:center; padding:16px; color:var(--muted); text-align:center; font-size:13px; line-height:1.55}
    .log-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
    .log-head h2{font-size:14px; margin:0}
    .log-list{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; max-height:345px; overflow:auto; padding-right:4px}
    .log-item{border:1px solid var(--line); background:var(--card-bg); border-radius:8px; padding:10px}
    .log-top{display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted)}
    .log-task{font-size:14px; margin-top:4px; overflow-wrap:anywhere}
    .empty-log{color:var(--muted); font-size:13px; padding:14px 0}
    .reward-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
    .reward-preview{display:none; width:100%; max-height:130px; object-fit:cover; border:1px solid var(--line); border-radius:8px; margin-top:8px}
    .reward-modal{position:fixed; inset:0; display:none; place-items:center; padding:20px; background:rgba(0,0,0,.62); z-index:10}
    .reward-modal.open{display:grid}
    .reward-box{width:min(520px,100%); background:var(--app-bg); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); overflow:hidden}
    .reward-box img{display:block; width:100%; max-height:68vh; object-fit:contain; background:var(--player-bg)}
    .reward-box canvas{display:none; width:100%; aspect-ratio:16/9; background:#181b22}
    .reward-caption{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px; color:var(--text)}
    .reward-caption strong{font-size:14px}
    .small{font-size:12px; color:var(--muted); line-height:1.55}
    .ok{color:var(--ok)}
    .warn{color:var(--warn)}
    #importFile{display:none}
    @media(max-width:1040px){.workbench{grid-template-columns:1fr}}
    @media(max-width:820px){body{padding:12px}}
    @media(max-width:540px){.header{padding:16px}.main,.side{padding:16px}.primary,.toolbar,.grid-3,.links{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.start{grid-column:auto}}
  </style>
</head>
<body>
  <main class="app">
    <div class="header">
      <h1>Pomodoro Desk</h1>
      <div class="header-actions">
        <select id="language" class="lang-select" aria-label="Language">
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
        <div class="badge" id="envBadge">local</div>
      </div>
    </div>

    <div class="layout">
      <section class="main" aria-label="timer">
        <div class="workbench">
          <div class="timer-pane">
            <div class="modes">
              <button class="mode active" data-mode="focus" data-i18n="modeFocus">集中</button>
              <button class="mode" data-mode="short" data-i18n="modeShort">短い休憩</button>
              <button class="mode" data-mode="long" data-i18n="modeLong">長い休憩</button>
            </div>

            <div class="task-row">
              <input id="task" data-i18n-placeholder="taskPlaceholder" placeholder="いま何をやる？ 例：試験用データ収集" />
              <button id="pinTask" class="icon-btn" data-i18n-title="pinTaskTitle" title="タスクをログに残す">＋</button>
            </div>

            <div id="timer" class="timer">25:00</div>
            <div id="status" class="status">集中する準備ができています</div>

            <div class="primary">
              <button id="start" class="start">START</button>
              <button id="reset" data-i18n="reset">RESET</button>
              <button id="skip" data-i18n="skip">SKIP</button>
            </div>

            <div class="stats">
              <div class="card"><div class="label" data-i18n="todayFocus">今日の集中</div><div class="value"><span id="todayCount">0</span></div></div>
              <div class="card"><div class="label" data-i18n="roundProgress">セット進捗</div><div class="value" id="roundCount">0 / 4</div></div>
              <div class="card"><div class="label" data-i18n="todayMinutes">今日の分数</div><div class="value"><span id="todayMinutes">0</span>m</div></div>
            </div>

            <div class="toolbar">
              <button id="pip" data-i18n="pip" data-i18n-title="pipTitle" title="小窓">小窓</button>
              <button id="notify" data-i18n="notify" data-i18n-title="notifyTitle" title="通知">通知</button>
              <button id="clearToday" data-i18n="clearToday" data-i18n-title="clearTodayTitle" title="タスクの集中数・分数・セット進捗をリセット">タスクリセット</button>
            </div>
          </div>

          <div class="media-pane section">
            <label><span data-i18n="mediaUrlLabel">動画URL</span></label>
            <div class="media-row">
              <input id="mediaUrl" placeholder="https://www.youtube.com/watch?v=..." />
              <div class="media-actions">
                <button id="openMedia" data-i18n="showPlayer" data-i18n-title="showPlayerTitle" title="プレイヤーで表示">プレイヤーで表示</button>
                <button id="stopMedia" data-i18n="stopPlayer" data-i18n-title="stopMediaTitle" title="停止">停止</button>
              </div>
            </div>
            <div id="player" class="player empty"><span data-i18n="playerPlaceholder">ここにYouTubeプレイヤーを表示します。</span></div>
            <div class="links">
              <a id="openYoutubeTab" href="https://www.youtube.com/" target="_blank" rel="noopener" data-i18n="openYoutubeTab">別タブでYouTube</a>
              <a id="openMusicTab" href="https://music.youtube.com/" target="_blank" rel="noopener" data-i18n="openMusicTab">別タブでMusic</a>
              <a id="openUrlTab" href="https://www.youtube.com/" target="_blank" rel="noopener" data-i18n="openUrlTab">別タブで開く</a>
            </div>
            <div class="info-note"><strong>i</strong><span data-i18n="playlistNote">YouTube再生リストURLなら連続再生します。TwitchはGitHub Pages版で確認してください。</span></div>
            <label class="section"><span data-i18n="bgmTitle">BGMタイトル</span>
              <input id="bgmTitle" data-i18n-placeholder="bgmTitlePlaceholder" placeholder="例：作業用BGM / 推し曲タイトル">
            </label>
            <div class="info-note"><strong>i</strong><span data-i18n="bgmTitleNote">ローカル稼働版では動画タイトルを自動取得しないため、必要なら手入力してください。</span></div>
          </div>
        </div>

        <details>
          <summary><span class="summary-label"><span class="summary-icon" aria-hidden="true">🔧</span><span data-i18n="settings">設定</span></span></summary>
          <div class="grid-3">
            <label><span data-i18n="focusMinutes">集中（分）</span><input id="focusMin" type="number" min="1" max="180" value="25"></label>
            <label><span data-i18n="shortMinutes">短い休憩（分）</span><input id="shortMin" type="number" min="1" max="60" value="5"></label>
            <label><span data-i18n="longMinutes">長い休憩（分）</span><input id="longMin" type="number" min="1" max="120" value="15"></label>
          </div>
          <div class="grid-2">
            <label><span data-i18n="targetRounds">長い休憩までのセット数</span><input id="targetRounds" type="number" min="1" max="12" value="4"></label>
            <label><span data-i18n="logLimit">ログ表示件数</span><input id="logLimit" type="number" min="5" max="100" value="20"></label>
            <label><span data-i18n="dayBoundaryHour">日付変更線（時）</span><input id="dayBoundaryHour" type="number" min="0" max="23" value="0"></label>
          </div>
          <div class="grid-2">
            <label><span data-i18n="theme">配色</span>
              <select id="theme">
                <option value="dark" data-i18n="themeDark">ダーク</option>
                <option value="light" data-i18n="themeLight">ライト</option>
                <option value="system" data-i18n="themeSystem">PC設定追従</option>
                <option value="tomato" data-i18n="themeTomato">柔らかいトマト色</option>
              </select>
            </label>
            <label><span data-i18n="soundPattern">終了音タイプ</span>
              <span class="sound-row">
                <select id="soundPattern">
                  <option value="chime3" data-i18n="soundChime3">チャイム 3秒</option>
                  <option value="chime5" data-i18n="soundChime5">チャイム 5秒</option>
                  <option value="chime10" data-i18n="soundChime10">チャイム 10秒</option>
                  <option value="cq1" data-i18n="soundCq1">CQ音 1回</option>
                  <option value="cq3" data-i18n="soundCq3">CQ音 3回</option>
                </select>
                <button id="testSound" type="button" data-i18n="testSound">試聴</button>
              </span>
            </label>
          </div>
          <div class="toggles">
            <label><input id="autoNext" type="checkbox"> <span data-i18n="autoNext">終了後に次を自動開始</span></label>
            <label><input id="soundOn" type="checkbox" checked> <span data-i18n="soundOn">終了音</span></label>
            <label><input id="stopMediaOnBreak" type="checkbox" checked> <span data-i18n="stopMediaOnBreak">休憩に入ったら動画を停止</span></label>
            <label><input id="rewardOn" type="checkbox" checked> <span data-i18n="rewardOn">集中完了時にご褒美画像</span></label>
          </div>
          <div class="section">
            <label><span data-i18n="rewardType">完了後の表示</span>
              <select id="rewardType">
                <option value="image" data-i18n="rewardTypeImage">ご褒美画像</option>

(() => {

    theme: $("#theme"), soundPattern: $("#soundPattern"), testSound: $("#testSound"), language: $("#language"),
    autoNext: $("#autoNext"), soundOn: $("#soundOn"), stopMediaOnBreak: $("#stopMediaOnBreak"),
    rewardOn: $("#rewardOn"), rewardType: $("#rewardType"), envBadge: $("#envBadge"),
    help: $("#help"), mediaUrl: $("#mediaUrl"), bgmTitle: $("#bgmTitle"), openMedia: $("#openMedia"), stopMedia: $("#stopMedia"),
    openYoutubeTab: $("#openYoutubeTab"), openMusicTab: $("#openMusicTab"), openUrlTab: $("#openUrlTab"),
    player: $("#player"), logList: $("#logList"), logCount: $("#logCount"),
    exportCsv: $("#exportCsv"), exportJson: $("#exportJson"), shareJson: $("#shareJson"),
    importJson: $("#importJson"), importFile: $("#importFile"), exportCard: $("#exportCard"),
    openDrive: $("#openDrive"), clearLogs: $("#clearLogs"),
    rewardFile: $("#rewardFile"), rewardPreview: $("#rewardPreview"), previewReward: $("#previewReward"),
    clearReward: $("#clearReward"), rewardModal: $("#rewardModal"), rewardImageView: $("#rewardImageView"), rewardCanvas: $("#rewardCanvas"),
    closeReward: $("#closeReward")
  };

  const KEY = "pomodoro-desk-v2";
  const oldKey = "pomodoro-mini-v1";
  const clamp = (value, min, max) => Math.min(max, Math.max(min, Number(value) || min));
  const dayBoundaryFrom = (state = null) => {
    if (state?.dayBoundaryHour !== undefined) return clamp(state.dayBoundaryHour, 0, 23);
    return clamp(els.dayBoundaryHour?.value ?? 0, 0, 23);
  };
  const dateKey = (date = new Date(), state = null) => {
    const boundary = dayBoundaryFrom(state);
    return new Date(date.getTime() - boundary * 60 * 60 * 1000).toLocaleDateString("sv-SE");
  };
  const i18n = {
    ja: {
      modeFocus:"集中", modeShort:"短い休憩", modeLong:"長い休憩",
      taskPlaceholder:"いま何をやる？ 例：試験用データ収集",
      pinTaskTitle:"タスクをログに残す", start:"START", pause:"PAUSE", reset:"RESET", skip:"SKIP",
      todayFocus:"今日の集中", roundProgress:"セット進捗", todayMinutes:"今日の分数",
      pip:"小窓", pipTitle:"小窓", notify:"通知", notifyOn:"通知ON", notifyOff:"通知OFF", notifyTitle:"通知",
      clearToday:"タスクリセット", clearTodayTitle:"タスクの集中数・分数・セット進捗をリセット",
      settings:"設定", focusMinutes:"集中（分）", shortMinutes:"短い休憩（分）", longMinutes:"長い休憩（分）",
      targetRounds:"長い休憩までのセット数", logLimit:"ログ表示件数", dayBoundaryHour:"日付変更線（時）", theme:"配色",
      themeDark:"ダーク", themeLight:"ライト", themeSystem:"PC設定追従", themeTomato:"柔らかいトマト色",
      soundPattern:"終了音タイプ", soundChime3:"チャイム 3秒", soundChime5:"チャイム 5秒",
      soundChime10:"チャイム 10秒", soundCq1:"CQ音 1回", soundCq3:"CQ音 3回",
      testSound:"試聴",
      autoNext:"終了後に次を自動開始", soundOn:"終了音", stopMediaOnBreak:"休憩に入ったら動画を停止", rewardOn:"集中完了時にご褒美画像",
      rewardType:"完了後の表示", rewardTypeImage:"ご褒美画像", rewardTypeTunnel:"目休めトンネル", rewardTypeSolar:"トマト宇宙",
      rewardImage:"ご褒美画像", previewReward:"表示テスト", clearReward:"画像削除", rewardTitle:"おつかれさま！", closeReward:"閉じる",
      log:"ログ", share:"共有", import:"読込", exportCard:"成果PNG",
      clearLogs:"全ログ削除", ready:"準備完了", paused:"一時停止", partial:"中断", skipped:"スキップ", runningSuffix:"中",
      emptyLog:"まだログはありません。", untitled:"無題", memo:"メモ", taskMemo:"タスクメモ", breakTask:"休憩",
      logsCount:(n) => `${n}件`, minutesSuffix:"m",
      focusDoneTitle:"集中おつかれさま", breakDoneTitle:"休憩終了",
      focusDoneBody:"次は休憩です。", breakDoneBody:"集中に戻ります。",
      notifyUnsupported:"このブラウザは通知APIに対応していません。",
      pipUnsupported:"小窓はChrome系ブラウザでHTTPSまたはlocalhostから開くと利用できます。",
      pipFailed:"小窓を開けませんでした。対応ブラウザと開き方を確認してください。",
      showPlayer:"プレイヤーで表示", showPlayerTitle:"下にYouTubeプレイヤーを表示",
      stopPlayer:"停止", stopMediaTitle:"埋め込み再生を停止",
      playerPlaceholder:"ここにYouTubeプレイヤーを表示します。",
      mediaUrlLabel:"動画URL",
      openYoutubeTab:"別タブでYouTube", openMusicTab:"別タブでMusic", openUrlTab:"別タブで開く",
      embedUnavailable:"このURLはアプリ内プレイヤーで表示できません。別タブ表示を使ってください。",
      localEmbedMayFail:"ローカルファイルではYouTubeやTwitchの埋め込みが失敗する場合があります。GitHub Pages版か別タブ表示を使ってください。",
      playlistNote:"YouTube再生リストURLなら連続再生します。TwitchはGitHub Pages版で確認してください。",
      bgmTitle:"BGMタイトル", bgmTitlePlaceholder:"例：作業用BGM / 推し曲タイトル",
      bgmTitleNote:"ローカル稼働版では動画タイトルを自動取得しないため、必要なら手入力してください。",
      jsonExported:"JSONを書き出しました。Google Driveに置けば別ブラウザへ読込できます。",
      csvExported:"CSVを書き出しました。Sheetsに読み込めます。",
      jsonImported:"JSONログを読み込みました。", jsonImportFailed:"JSONを読み込めませんでした。",
      rewardSaved:"ご褒美画像を保存しました。", rewardCleared:"ご褒美画像を削除しました。",
      rewardTooLarge:"画像を保存できませんでした。別の画像で試してください。",
      confirmClearLogs:"全ログを削除しますか？", helpDefault:"ログはこのブラウザに保存されます。"
    },
    en: {
      modeFocus:"Focus", modeShort:"Short break", modeLong:"Long break",
      taskPlaceholder:"What are you working on? e.g. collect test data",
      pinTaskTitle:"Add task to log", start:"START", pause:"PAUSE", reset:"RESET", skip:"SKIP",
      todayFocus:"Focus today", roundProgress:"Round progress", todayMinutes:"Minutes today",
      pip:"Mini window", pipTitle:"Mini window", notify:"Notify", notifyOn:"Notify ON", notifyOff:"Notify OFF", notifyTitle:"Notifications",
      clearToday:"Reset task", clearTodayTitle:"Reset focus count, minutes, and round progress for this task",
      settings:"Settings", focusMinutes:"Focus minutes", shortMinutes:"Short break minutes", longMinutes:"Long break minutes",
      targetRounds:"Rounds before long break", logLimit:"Log rows to show", dayBoundaryHour:"Day starts at", theme:"Theme",
      themeDark:"Dark", themeLight:"Light", themeSystem:"Follow system", themeTomato:"Soft tomato",
      soundPattern:"End sound type", soundChime3:"Chime 3 sec", soundChime5:"Chime 5 sec",
      soundChime10:"Chime 10 sec", soundCq1:"CQ once", soundCq3:"CQ three times",
      testSound:"Test",
      autoNext:"Auto-start next session", soundOn:"End sound", stopMediaOnBreak:"Stop video on break", rewardOn:"Reward image after focus",
      rewardType:"After-focus display", rewardTypeImage:"Reward image", rewardTypeTunnel:"Eye-rest tunnel", rewardTypeSolar:"Tomato space",
      rewardImage:"Reward image", previewReward:"Preview", clearReward:"Clear image", rewardTitle:"Nice work!", closeReward:"Close",
      log:"Log", share:"Share", import:"Import", exportCard:"Card PNG",
      clearLogs:"Clear all logs", ready:"Ready", paused:"Paused", partial:"partial", skipped:"skipped", runningSuffix:"",
      emptyLog:"No logs yet.", untitled:"Untitled", memo:"Memo", taskMemo:"Task memo", breakTask:"Break",
      logsCount:(n) => `${n} logs`, minutesSuffix:"m",
      focusDoneTitle:"Focus complete", breakDoneTitle:"Break finished",
      focusDoneBody:"Time for a break.", breakDoneBody:"Back to focus.",
      notifyUnsupported:"This browser does not support notifications.",
      pipUnsupported:"Mini window works in Chromium browsers over HTTPS or localhost.",
      pipFailed:"Could not open the mini window. Check your browser and how the page is opened.",
      showPlayer:"Show player", showPlayerTitle:"Show the YouTube player below",
      stopPlayer:"Stop", stopMediaTitle:"Stop embedded playback",
      playerPlaceholder:"The YouTube player will appear here.",
      mediaUrlLabel:"Video URL",
      openYoutubeTab:"YouTube in new tab", openMusicTab:"Music in new tab", openUrlTab:"Open URL",
      embedUnavailable:"This URL cannot be shown in the in-app player. Use the new-tab buttons instead.",
      localEmbedMayFail:"YouTube and Twitch embeds may fail from local files. Use the GitHub Pages version or the new-tab buttons.",
      playlistNote:"YouTube playlist URLs play continuously. Check Twitch on the GitHub Pages version.",
      bgmTitle:"BGM title", bgmTitlePlaceholder:"e.g. work BGM / favorite track title",
      bgmTitleNote:"The local version does not auto-fetch video titles, so enter one manually if needed.",
      jsonExported:"Exported JSON. Put it on Google Drive and import it in another browser.",
      csvExported:"Exported CSV. You can import it into Sheets.",
      jsonImported:"Imported JSON log.", jsonImportFailed:"Could not import that JSON file.",
      rewardSaved:"Saved reward image.", rewardCleared:"Cleared reward image.",
      rewardTooLarge:"Could not save that image. Try a different one.",
      confirmClearLogs:"Delete all logs?", helpDefault:"Logs are saved in this browser."
    }
  };

  let saved = loadState();
  let mode = saved.mode || "focus";
  let running = false;
  let endAt = null;
  let startedAt = null;
  let remainingMs = null;
  let interval = null;
  let pipWindow = null;
  let rewardAnimation = null;

  hydrate();
  remainingMs = durationMs(mode);
  save();
  render();

  function loadState(){
    let state = null;
    try { state = JSON.parse(localStorage.getItem(KEY) || "null"); } catch {}
    if (!state) {
      try {
        const old = JSON.parse(localStorage.getItem(oldKey) || "null");
        if (old) state = {...old, targetRounds:4, logLimit:20, logs:[]};
      } catch {}
    }
    state ||= {};
    if (state.date !== dateKey(new Date(), state)) {
      state.date = dateKey(new Date(), state);
      state.today = 0;
      state.round = 0;
      state.todayMinutes = 0;
    }
    state.logs ||= [];
    return state;
  }

  function hydrate(){
    els.focusMin.value = saved.focusMin || 25;
    els.shortMin.value = saved.shortMin || 5;
    els.longMin.value = saved.longMin || 15;
    els.targetRounds.value = saved.targetRounds || 4;
    els.logLimit.value = saved.logLimit || 20;
    els.dayBoundaryHour.value = saved.dayBoundaryHour ?? 0;
    els.theme.value = saved.theme || "dark";
    els.soundPattern.value = saved.soundPattern || "chime3";
    applyTheme(els.theme.value);
    els.language.value = saved.language || "ja";
    applyLanguage(els.language.value);
    els.task.value = saved.task || "";
    els.mediaUrl.value = saved.mediaUrl || "";
    els.bgmTitle.value = saved.bgmTitle || "";
    els.autoNext.checked = !!saved.autoNext;
    els.soundOn.checked = saved.soundOn !== false;
    els.stopMediaOnBreak.checked = saved.stopMediaOnBreak !== false;
    els.rewardOn.checked = saved.rewardOn !== false;
    els.rewardType.value = saved.rewardType || "image";
    updateRewardPreview();
    updateMediaLinks();
  }

  function statePayload(){
    return {
      date: dateKey(),
      today: saved.today || 0,
      round: saved.round || 0,
      todayMinutes: saved.todayMinutes || 0,
      mode,
      focusMin: clamp(els.focusMin.value, 1, 180),
      shortMin: clamp(els.shortMin.value, 1, 60),
      longMin: clamp(els.longMin.value, 1, 120),
      targetRounds: clamp(els.targetRounds.value, 1, 12),
      logLimit: clamp(els.logLimit.value, 5, 100),
      dayBoundaryHour: clamp(els.dayBoundaryHour.value, 0, 23),
      theme: els.theme.value,
      soundPattern: els.soundPattern.value,
      language: els.language.value,
      task: els.task.value,
      mediaUrl: els.mediaUrl.value,
      bgmTitle: els.bgmTitle.value,
      autoNext: els.autoNext.checked,
      soundOn: els.soundOn.checked,
      stopMediaOnBreak: els.stopMediaOnBreak.checked,
      rewardOn: els.rewardOn.checked,
      rewardType: els.rewardType.value,
      rewardImage: saved.rewardImage || "",
      logs: saved.logs || []
    };
  }

  function save(){
    const currentDate = dateKey();
    if (saved.date && saved.date !== currentDate) {
      saved.date = currentDate;
      saved.today = 0;
      saved.round = 0;
      saved.todayMinutes = 0;
    }
    saved = {...saved, ...statePayload()};
    localStorage.setItem(KEY, JSON.stringify(saved));
  }

  function applyTheme(theme){
    document.body.dataset.theme = ["dark","light","system","tomato"].includes(theme) ? theme : "dark";
    applyPiPTheme();
  }

  function currentLang(){
    return i18n[els.language.value] ? els.language.value : "ja";
  }

  function t(key){
    return i18n[currentLang()][key] ?? i18n.ja[key] ?? key;
  }

  function applyLanguage(lang){
    document.documentElement.lang = i18n[lang] ? lang : "ja";
    $$("[data-i18n]").forEach(el => {
      const value = t(el.dataset.i18n);
      if (typeof value === "string") el.textContent = value;
    });
    $$("[data-i18n-placeholder]").forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
    $$("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
    els.help.textContent = t("helpDefault");
    render();
  }

  function durationMs(m = mode){
    const mins = m === "focus" ? els.focusMin.value : m === "short" ? els.shortMin.value : els.longMin.value;
    return clamp(mins, 1, 180) * 60 * 1000;
  }

  function fmt(ms){
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  function currentRemaining(){
    return running ? Math.max(0, endAt - Date.now()) : (remainingMs ?? durationMs());
  }

  function modeLabel(value = mode){
    return value === "focus" ? t("modeFocus") : value === "short" ? t("modeShort") : t("modeLong");
  }

  function render(){
    const ms = currentRemaining();
    const text = fmt(ms);
    const target = clamp(els.targetRounds.value, 1, 12);
    els.timer.textContent = text;
    document.title = `${text} ${modeLabel()}`;
    els.start.textContent = running ? t("pause") : t("start");
    els.status.textContent = running
      ? `${modeLabel()}${t("runningSuffix")}${els.task.value ? " - " + els.task.value : ""}`
      : `${modeLabel()} - ${ms === durationMs() ? t("ready") : t("paused")}`;
    els.todayCount.textContent = saved.today || 0;
    els.roundCount.textContent = `${saved.round || 0} / ${target}`;
    els.todayMinutes.textContent = saved.todayMinutes || 0;
    els.logCount.textContent = t("logsCount")((saved.logs || []).length);
    $$(".mode").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
    renderLogs();
    updatePlayerPlaceholder();
    updateMediaLinks();
    renderPiP(text);
  }

  function renderLogs(){
    const limit = clamp(els.logLimit.value, 5, 100);
    const logs = [...(saved.logs || [])].slice(-limit).reverse();
    if (!logs.length) {
      els.logList.innerHTML = `<div class="empty-log">${escapeHtml(t("emptyLog"))}</div>`;
      return;
    }
    els.logList.innerHTML = logs.map(log => `
      <div class="log-item">
        <div class="log-top">
          <span>${escapeHtml(log.date)} ${escapeHtml(log.time)}</span>
          <span>${escapeHtml(log.mode)} / ${log.minutes}m</span>
        </div>
        <div class="log-task">${escapeHtml(log.task || t("untitled"))}</div>
        ${log.bgmTitle || log.bgmUrl ? `<div class="log-top">${escapeHtml(log.bgmTitle || "BGM")} ${log.bgmUrl ? "· URL" : ""}</div>` : ""}
      </div>
    `).join("");
  }

  function escapeHtml(text){
    return String(text).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  function setMode(next, preserve = false){
    capturePartialFocus();
    mode = next;
    running = false;
    endAt = null;
    startedAt = null;
    remainingMs = preserve ? remainingMs : durationMs(next);
    stopInterval();
    save();
    render();
  }

  function start(){
    if (running) return pause();
    const rem = currentRemaining() || durationMs();
    endAt = Date.now() + rem;
    startedAt ||= Date.now();
    remainingMs = null;
    running = true;
    interval = setInterval(tick, 250);
    render();
  }

  function pause(){
    if (!running) return;
    remainingMs = Math.max(0, endAt - Date.now());
    capturePartialFocus();
    running = false;
    endAt = null;
    stopInterval();
    render();
  }

  function reset(){
    capturePartialFocus();
    running = false;
    endAt = null;
    startedAt = null;
    remainingMs = durationMs();
    stopInterval();
    render();
  }

  function stopInterval(){
    if (interval) clearInterval(interval);
    interval = null;
  }

  function tick(){
    if (!running) return;
    if (Date.now() >= endAt) complete();
    else render();
  }

  function complete(){
    const finished = mode;
    const minutes = actualElapsedMinutes(finished);
    running = false;
    stopInterval();
    endAt = null;
    beep();
    notifyFinished();

    if (finished === "focus") {
      saved.today = (saved.today || 0) + 1;
      saved.todayMinutes = (saved.todayMinutes || 0) + minutes;
      saved.round = (saved.round || 0) + 1;
      addLog({mode:modeLabel(finished), minutes, task:els.task.value, startedAt});
      showReward();
      const target = clamp(els.targetRounds.value, 1, 12);
      const next = saved.round >= target ? "long" : "short";
      if (saved.round >= target) saved.round = 0;
      if (els.stopMediaOnBreak.checked) stopMedia();
      mode = next;
    } else {
      addLog({mode:modeLabel(finished), minutes, task:t("breakTask"), startedAt});
      mode = "focus";
    }

    startedAt = null;
    remainingMs = durationMs(mode);
    save();
    render();
    if (els.autoNext.checked && finished !== "long") start();
  }

  function addLog({mode, minutes, task, startedAt}){
    const now = new Date();
    const start = startedAt ? new Date(startedAt) : new Date(now.getTime() - minutes * 60000);
    saved.logs = [...(saved.logs || []), {
      id: crypto.randomUUID ? crypto.randomUUID() : String(now.getTime()),
      date: dateKey(now),
      time: now.toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit"}),
      mode,
      minutes,
      task: task || "",
      bgmTitle: els.bgmTitle.value || "",
      bgmUrl: els.mediaUrl.value || "",
      startedAt: start.toISOString(),
      endedAt: now.toISOString()
    }].slice(-1000);
  }

  function actualElapsedMinutes(finishedMode){
    if (!startedAt) return Math.round(durationMs(finishedMode) / 60000);
    return Math.max(1, Math.round((Date.now() - startedAt) / 60000));
  }

  function capturePartialFocus(){
    if (mode !== "focus" || !startedAt) return;
    const elapsedMs = Date.now() - startedAt;
    const minutes = Math.floor(elapsedMs / 60000);
    if (minutes < 1) {
      startedAt = null;
      return;
    }
    saved.todayMinutes = (saved.todayMinutes || 0) + minutes;
    addLog({mode:`${modeLabel("focus")} (${t("partial")})`, minutes, task:els.task.value, startedAt});
    startedAt = null;
    save();
  }

  function skip(){
    running = false;
    stopInterval();
    endAt = null;
    const target = clamp(els.targetRounds.value, 1, 12);
    if (mode === "focus") {
      const minutes = startedAt ? actualElapsedMinutes("focus") : 0;
      if (minutes > 0) {
        saved.todayMinutes = (saved.todayMinutes || 0) + minutes;
        addLog({mode:`${modeLabel("focus")} (${t("skipped")})`, minutes, task:els.task.value, startedAt});
      }
      saved.today = (saved.today || 0) + 1;
      saved.round = (saved.round || 0) + 1;
      const goesLong = saved.round >= target;
      mode = goesLong ? "long" : "short";
      if (goesLong) saved.round = 0;
      if (els.stopMediaOnBreak.checked) stopMedia();
    } else {
      mode = "focus";
    }
    startedAt = null;
    remainingMs = durationMs(mode);
    save();
    render();
  }

  function beep(){
    if (!els.soundOn.checked) return;
    playSelectedSound();
  }

  function playSelectedSound(){
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const pattern = els.soundPattern.value || "chime3";
      const totalMs = pattern === "chime10" ? 10000 : pattern === "chime5" ? 5000 : 3000;
      const length = pattern === "cq3" ? playCq(ctx, 3) : pattern === "cq1" ? playCq(ctx, 1) : playChime(ctx, totalMs / 1000);
      setTimeout(() => ctx.close(), Math.ceil(length * 1000) + 300);
    } catch {}
  }

  function tone(ctx, freq, start, duration, gain = .08, type = "sine"){
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    const end = start + duration;
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(gain, start + .025);
    g.gain.setValueAtTime(gain, Math.max(start + .03, end - .05));
    g.gain.linearRampToValueAtTime(0, end);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(start);
    o.stop(end);
  }

  function playChime(ctx, seconds){
    const motif = [660, 880, 784, 988];
    const now = ctx.currentTime;
    const step = .5;
    const count = Math.max(1, Math.floor(seconds / step));
    for (let i = 0; i < count; i++) {
      tone(ctx, motif[i % motif.length], now + i * step, .28, .075);
    }
    tone(ctx, 660, now + seconds - .38, .34, .06);
    return seconds;
  }

  function playCq(ctx, repeats){
    const unit = .09;
    const gap = unit;
    const letterGap = unit * 3;
    const wordGap = unit * 7;
    const dash = unit * 3;
    const freq = 720;
    let at = ctx.currentTime;
    const playSymbol = (duration) => {
      tone(ctx, freq, at, duration, .085, "sine");
      at += duration + gap;
    };
    const playLetter = (symbols) => {
      symbols.forEach(symbol => playSymbol(symbol === "-" ? dash : unit));
      at += letterGap - gap;
    };
    for (let i = 0; i < repeats; i++) {
      playLetter(["-",".","-","."]);
      playLetter(["-","-",".","-"]);
      at += wordGap - letterGap;
    }
    return at - ctx.currentTime;
  }

  function mediaEmbedUrl(raw){
    return youtubeEmbedUrl(raw) || niconicoEmbedUrl(raw) || twitchEmbedUrl(raw) || soundCloudEmbedUrl(raw);
  }

  function youtubeEmbedUrl(raw){
    try {
      const url = new URL(raw);
      const host = url.hostname.replace(/^www\./, "");
      const isYoutube = host === "youtu.be" || host.endsWith("youtube.com");
      if (!isYoutube) return "";
      const list = normalizedYoutubeList(url.searchParams.get("list") || "");
      let id = "";
      if (host === "youtu.be") id = url.pathname.slice(1);
      if (host.endsWith("youtube.com")) {
        id = url.searchParams.get("v") || "";
        if (!id && url.pathname.startsWith("/live/")) id = url.pathname.split("/")[2] || "";
        if (!id && url.pathname.startsWith("/shorts/")) id = url.pathname.split("/")[2] || "";
      }
      if (id) {
        const params = new URLSearchParams({autoplay:"1"});
        if (list) params.set("list", list);
        return `https://www.youtube.com/embed/${encodeURIComponent(id)}?${params}`;
      }
      if (list) {
        const params = new URLSearchParams({autoplay:"1", listType:"playlist", list});
        return `https://www.youtube.com/embed?${params}`;
      }
      return "";
    } catch {
      return "";
    }
  }

  function normalizedYoutubeList(list){
    const value = String(list || "").trim();
    if (!value || value === "WL") return "";
    if (/^(PL|OL|UU|LL|RD)[\w-]+$/.test(value)) return value;
    return "";
  }

  function niconicoEmbedUrl(raw){
    try {
      const url = new URL(raw);
      const host = url.hostname.replace(/^www\./, "");
      if (!host.endsWith("nicovideo.jp")) return "";
      const match = url.pathname.match(/\/watch\/([a-z]{2}\d+|\d+)/i);
      return match ? `https://embed.nicovideo.jp/watch/${encodeURIComponent(match[1])}` : "";
    } catch {
      return "";
    }
  }

  function twitchEmbedUrl(raw){
    try {
      const url = new URL(raw);
      const host = url.hostname.replace(/^www\./, "");
      if (!host.endsWith("twitch.tv")) return "";
      const parts = url.pathname.split("/").filter(Boolean);
      const params = new URLSearchParams({parent:twitchParent(), autoplay:"true"});
      if (host === "clips.twitch.tv") {
        if (!parts[0]) return "";
        params.set("clip", parts[0]);
        return `https://clips.twitch.tv/embed?${params}`;
      }
      if (parts[0] === "videos" && parts[1]) {
        params.set("video", `v${parts[1].replace(/^v/i, "")}`);
        return `https://player.twitch.tv/?${params}`;
      }
      if (parts[0]) {
        params.set("channel", parts[0]);
        return `https://player.twitch.tv/?${params}`;
      }
      return "";
    } catch {
      return "";
    }
  }

  function twitchParent(){
    return window.location.hostname || "itsukiisamu.github.io";
  }

  function soundCloudEmbedUrl(raw){
    try {
      const url = new URL(raw);
      const host = url.hostname.replace(/^www\./, "");
      if (!host.endsWith("soundcloud.com")) return "";
      const params = new URLSearchParams({
        url: raw,
        auto_play: "true",
        hide_related: "false",
        show_comments: "false",
        show_user: "true",
        show_reposts: "false",
        visual: "true"
      });
      return `https://w.soundcloud.com/player/?${params}`;
    } catch {
      return "";
    }
  }

  function buildCardData(){
    const workDate = dateKey();
    const todayLogs = (saved.logs || []).filter(log => log.date === workDate);
    const focusLogs = todayLogs.filter(log => String(log.mode || "").includes(t("modeFocus")) || String(log.mode || "").toLowerCase().includes("focus"));
    const breakLogs = todayLogs.filter(log => String(log.mode || "").includes(t("modeShort")) || String(log.mode || "").includes(t("modeLong")) || String(log.mode || "").toLowerCase().includes("break"));
    const taskMap = new Map();
    focusLogs.forEach(log => {
      const name = log.task || t("untitled");
      taskMap.set(name, (taskMap.get(name) || 0) + (Number(log.minutes) || 0));
    });
    const tasks = [...taskMap.entries()]
      .map(([name, minutes]) => ({name, minutes}))
      .sort((a, b) => b.minutes - a.minutes)
      .slice(0, 3);
    const total = focusLogs.reduce((sum, log) => sum + (Number(log.minutes) || 0), 0) || (saved.todayMinutes || 0);
    const latestBgm = [...todayLogs].reverse().find(log => log.bgmTitle || log.bgmUrl) || {};
    const displayDate = new Date(`${workDate}T12:00:00`);
    return {
      date: workDate.replaceAll("-", "."),
      weekday: displayDate.toLocaleDateString("en-US", {weekday:"short"}),
      focusMinutes: total,
      focusTime: minutesToHm(total),
      focusSessions: focusLogs.length || (saved.today || 0),
      breakSessions: breakLogs.length,
      tasks: tasks.length ? tasks : [{name:t("untitled"), minutes:total || 0}],
      bgmTitle: latestBgm.bgmTitle || els.bgmTitle.value || "BGM",
      bgmUrl: latestBgm.bgmUrl || els.mediaUrl.value || "https://itsukiisamu.github.io/pomodoro-desk/",
      appUrl: "https://itsukiisamu.github.io/pomodoro-desk/"
    };
  }

  function minutesToHm(minutes){
    const h = Math.floor((Number(minutes) || 0) / 60);
    const m = (Number(minutes) || 0) % 60;
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
  }

  function drawWorkCard(ctx, canvas, data){
    const w = canvas.width;
    const h = canvas.height;
    const roundRect = (x, y, width, height, radius) => {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    };
    const text = (value, x, y, size, color, weight = 500, align = "left") => {
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px system-ui, -apple-system, Segoe UI, sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = "alphabetic";
      ctx.fillText(value, x, y);
    };
    const ellipsis = (value, maxWidth, size) => {
      const source = String(value || "");
      ctx.font = `500 ${size}px system-ui, -apple-system, Segoe UI, sans-serif`;
      if (ctx.measureText(source).width <= maxWidth) return source;
      let clipped = source;
      while (clipped.length > 0 && ctx.measureText(`${clipped}...`).width > maxWidth) clipped = clipped.slice(0, -1);
      return `${clipped}...`;
    };
    ctx.fillStyle = "#181b22";
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = .08;
    for (let i = 0; i < 38; i++) {
      ctx.beginPath();
      ctx.arc(120 + i * 31, 160 + Math.sin(i) * 80, 3 + (i % 4), 0, Math.PI * 2);
      ctx.fillStyle = i % 2 ? "#f2a08f" : "#70a98a";
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    text("#pomodoro-desk", 72, 96, 18, "#a4adbb", 500);
    text(`${data.date} ${data.weekday}`, 1008, 96, 24, "#d9a79d", 500, "right");
    text("今日の作業ログ", 72, 176, 54, "#fff1eb", 700);
    text("Today's Task Log", 76, 224, 28, "#f3b8ad", 600);
    text("🍅".repeat(Math.min(12, data.focusSessions || 0)), 1008, 190, 31, "#fff1eb", 500, "right");
    text(data.focusTime, 72, 350, 132, "#fff1eb", 800);
    text(`${data.focusMinutes} min`, 390, 328, 34, "#f3b8ad", 600);
    text(`Focus ${data.focusSessions} / Break ${data.breakSessions}`, 390, 376, 28, "#f1c5bc", 600);

    roundRect(72, 440, 600, 304, 28);
    ctx.fillStyle = "rgba(20, 6, 6, .46)";
    ctx.fill();
    text("WORK LOG", 108, 496, 22, "#f3b8ad", 700);
    let y = 552;
    const max = Math.max(1, ...data.tasks.map(task => task.minutes));
    data.tasks.forEach((task, index) => {
      text(ellipsis(task.name, 410, 28), 108, y, 28, "#fff1eb", 600);
      text(`${task.minutes}m`, 636, y, 24, "#f3b8ad", 600, "right");
      ctx.fillStyle = "rgba(255, 240, 232, .16)";
      roundRect(108, y + 18, 500, 14, 7);
      ctx.fill();
      ctx.fillStyle = index === 2 ? "#70a98a" : "#e56a5f";
      roundRect(108, y + 18, 500 * task.minutes / max, 14, 7);
      ctx.fill();
      y += 76;
    });

    roundRect(716, 440, 292, 304, 28);
    ctx.fillStyle = "rgba(20, 6, 6, .46)";
    ctx.fill();
    text("SESSIONS", 752, 496, 22, "#f3b8ad", 700);
    text("Focus", 752, 568, 30, "#f1c5bc", 600);
    text(String(data.focusSessions), 970, 568, 50, "#fff1eb", 800, "right");
    text("Break", 752, 640, 30, "#f1c5bc", 600);
    text(String(data.breakSessions), 970, 640, 50, "#fff1eb", 800, "right");

    roundRect(72, 804, 936, 154, 30);
    ctx.fillStyle = "rgba(255, 221, 211, .12)";
    ctx.fill();
    text("BGM", 108, 852, 20, "#f3b8ad", 700);
    text(ellipsis(data.bgmTitle, 820, 30), 108, 896, 30, "#fff1eb", 600);
    text(ellipsis(data.bgmUrl, 820, 22), 108, 934, 22, "#f1c5bc", 500);
    text(data.appUrl, 540, 1004, 18, "#a4adbb", 500, "center");
  }

  function startRewardAnimation(type){
    const canvas = els.rewardCanvas;
    const ctx = canvas.getContext("2d");
    const start = performance.now();
    const draw = (now) => {
      const elapsed = Math.min(20, (now - start) / 1000);
      if (type === "solar") drawSolarRest(ctx, canvas, elapsed);
      else drawTunnelRest(ctx, canvas, elapsed);
      if (elapsed < 20) rewardAnimation = requestAnimationFrame(draw);
      else rewardAnimation = null;
    };
    rewardAnimation = requestAnimationFrame(draw);
  }

  function drawTunnelRest(ctx, canvas, elapsed){
    const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2;
    const phase = (elapsed % 20) / 20;
    const gradient = ctx.createRadialGradient(cx, cy, 12, cx, cy, Math.max(w, h) * .72);
    gradient.addColorStop(0, "#05241b");
    gradient.addColorStop(.14, "#0b3327");
    gradient.addColorStop(.48, "#6f1716");
    gradient.addColorStop(1, "#3a0809");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.translate(cx, cy);
    for (let i = 0; i < 36; i++) {
      const z = ((i / 36 + phase * .55) % 1);
      const scale = 1 - z;
      const radius = 24 + scale * 280;
      const alpha = .04 + scale * .14;
      ctx.beginPath();
      ctx.ellipse(0, 0, radius * 1.18, radius * .64, 0, 0, Math.PI * 2);
      ctx.strokeStyle = i % 2 ? "#c94b43" : "#8f201d";
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 1 + scale * 1.8;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.font = "30px system-ui, Apple Color Emoji, Segoe UI Emoji, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🍅", 0, 0);
    ctx.restore();
  }

  function drawSolarRest(ctx, canvas, elapsed){
    const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2;
    ctx.fillStyle = "#170707";
    ctx.fillRect(0, 0, w, h);
    const planets = [
      {r:58, size:23, speed:.34, offset:.1, emoji:"💧", color:"#74b7ff"},
      {r:92, size:25, speed:.23, offset:2.1, emoji:"🔥", color:"#ff6b4f"},
      {r:132, size:20, speed:.16, offset:3.5, emoji:"🌿", color:"#7db99b"},
      {r:178, size:22, speed:.11, offset:1.2, emoji:"✨", color:"#f1a35f"}
    ];
    ctx.save();
    ctx.translate(cx, cy);
    ctx.font = "46px system-ui, Apple Color Emoji, Segoe UI Emoji, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🍅", 0, 0);
    planets.forEach((p, index) => {
      ctx.globalAlpha = .18;
      ctx.strokeStyle = index === 2 ? "#386c55" : "#8f2a24";
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r * 1.4, p.r * .62, 0, 0, Math.PI * 2);
      ctx.stroke();
      const angle = p.offset + elapsed * p.speed;
      const x = Math.cos(angle) * p.r * 1.4;
      const y = Math.sin(angle) * p.r * .62;
      const depth = .72 + Math.sin(angle) * .28;
      ctx.globalAlpha = .16 + depth * .16;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x, y, p.size * (.45 + depth * .18), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = .95;
      ctx.font = `${p.size * (.72 + depth * .2)}px system-ui, Apple Color Emoji, Segoe UI Emoji, sans-serif`;
      ctx.fillText(p.emoji, x, y);
    });
    ctx.restore();
  }

  function readRewardImage(file){
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => resizeRewardImage(reader.result).then(dataUrl => {
      saved.rewardImage = dataUrl;
      updateRewardPreview();
      save();
      setHelp(t("rewardSaved"), "ok");
    }).catch(() => setHelp(t("rewardTooLarge"), "warn"));
    reader.readAsDataURL(file);
  }

  function resizeRewardImage(src){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const max = 1200;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", .86);
        if (dataUrl.length > 4500000) reject(new Error("too large"));
        else resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = src;
    });
  }

  els.start.onclick = () => running ? pause() : start();
  els.reset.onclick = reset;
  els.skip.onclick = skip;
  els.pip.onclick = openPiP;
  els.notify.onclick = requestNotify;
  els.openMedia.onclick = openMedia;
  els.stopMedia.onclick = stopMedia;
  els.testSound.onclick = playSelectedSound;
  els.previewReward.onclick = () => showReward(true);
  els.closeReward.onclick = hideReward;
  els.rewardModal.onclick = (event) => {
    if (event.target === els.rewardModal) hideReward();
  };
  els.clearReward.onclick = () => {
    saved.rewardImage = "";
    updateRewardPreview();
    save();
    setHelp(t("rewardCleared"), "ok");
  };
  els.rewardFile.onchange = () => {
    const file = els.rewardFile.files && els.rewardFile.files[0];
    if (file) readRewardImage(file);
    els.rewardFile.value = "";
  };
  els.pinTask.onclick = () => {
    addLog({mode:t("memo"), minutes:0, task:els.task.value || t("taskMemo"), startedAt:Date.now()});
    save();
    render();
  };
  els.clearToday.onclick = () => {
    saved.today = 0;
    saved.round = 0;
    saved.todayMinutes = 0;
    save();
    render();
  };
  els.exportCsv.onclick = exportCsv;
  els.exportJson.onclick = exportJson;
  els.exportCard.onclick = exportWorkCard;
  els.shareJson.onclick = () => shareJson().catch(() => exportJson());
  els.importJson.onclick = () => els.importFile.click();
  els.importFile.onchange = () => {
    const file = els.importFile.files && els.importFile.files[0];
    if (file) importJsonFile(file);
    els.importFile.value = "";
  };
  els.openDrive.onclick = () => window.open("https://drive.google.com/drive/my-drive", "_blank", "noopener");
  els.clearLogs.onclick = () => {
    if (!confirm(t("confirmClearLogs"))) return;
    saved.logs = [];
    save();
    render();
  };
  els.task.addEventListener("input", save);
  els.mediaUrl.addEventListener("input", updateMediaLinks);
  els.mediaUrl.addEventListener("change", () => {
    save();
    updateMediaLinks();
  });
  els.bgmTitle.addEventListener("input", save);
  els.theme.addEventListener("change", () => {
    applyTheme(els.theme.value);
    save();
    render();
  });
  els.language.addEventListener("change", () => {
    applyLanguage(els.language.value);
    save();
  });
  $$(".mode").forEach(b => b.onclick = () => setMode(b.dataset.mode));
  [els.focusMin, els.shortMin, els.longMin, els.targetRounds, els.logLimit, els.dayBoundaryHour].forEach(input => {
    input.addEventListener("change", () => {
      save();
      if (!running) remainingMs = durationMs();
      render();
    });
  });
  [els.autoNext, els.soundOn, els.stopMediaOnBreak, els.rewardOn, els.rewardType, els.soundPattern].forEach(input => input.addEventListener("change", save));

  els.envBadge.textContent = window.isSecureContext ? "secure" : "local file";
  if ("Notification" in window && Notification.permission === "granted") els.notify.textContent = t("notifyOn");
})();
</script>
</body>
</html>
